name: Run Scheduled Backend Workers

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-backend-workers
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Deliver due scheduled messages
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run jobs:scheduled-messages

      - name: Clean up unreferenced message attachments
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run jobs:attachment-cleanup

      - name: Send pending call invitations
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: npm run jobs:call-notifications
