name: Backend quality

# Keep the full migration, route and service regression coverage on pull requests.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/**"
      - "package.json"
      - "yarn.lock"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "supabase/**"
      - "package.json"
      - "yarn.lock"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run health and diagnostics tests
        run: |
          yarn run test:health-endpoints
          yarn run test:health-unit

      - name: Run security and API hardening tests
        run: |
          yarn run test:security-headers
          yarn run test:database-hardening
          yarn run test:api-hardening
          yarn run test:observability

      - name: Run AI and profile privacy tests
        run: |
          yarn run test:ai-input-validation
          yarn run test:profile-privacy
          yarn run test:contact-directory-privacy

      - name: Run chat media and storage cleanup tests
        run: |
          yarn run test:chat-media-upload-limit
          yarn run test:account-storage-cleanup

      - name: Run call and conference tests
        run: |
          yarn run test:call-signaling
          yarn run test:group-calls

      - name: Run LIVE and replay tests
        run: |
          yarn run test:live-streams
          yarn run test:live-replay

      - name: Run migration and history integrity tests
        run: |
          yarn run test:migration-reconciliation
          yarn run test:history-deletion
          yarn run test:status-media-migration
          yarn run test:status-video-migration

      - name: Run backend Jest suite
        run: yarn test
