name: Backend quality

# Account deletion media cleanup is a release-critical privacy regression suite.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "yarn.lock"
      - "package-lock.json"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "yarn.lock"
      - "package-lock.json"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run AI input validation regression tests
        run: yarn run test:ai-input-validation

      - name: Run chat media upload limit regression tests
        run: yarn run test:chat-media-upload-limit

      - name: Run account storage cleanup regression tests
        run: yarn run test:account-storage-cleanup

      - name: Run profile and private-avatar privacy regression tests
        run: yarn run test:profile-privacy

      - name: Run LIVE replay regression tests
        run: yarn run test:live-replay

      - name: Run LIVE stream and stage-management regression tests
        run: yarn run test:live-streams

      - name: Run LIVE and call history deletion regression tests
        run: yarn run test:history-deletion

      - name: Run backend Jest suite
        run: yarn test
