name: LIVE creator preferences migration preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zannychat-live-production-migrations
  cancel-in-progress: false

jobs:
  preview:
    name: Preview only LIVE creator preferences migration
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase --version
      - name: Build isolated migration workspace with applied history
        id: workspace
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d "${RUNNER_TEMP}/zannychat-live-preferences.XXXXXX")"
          mkdir -p "$WORKDIR/supabase/migrations"
          find supabase/migrations -maxdepth 1 -type f -name '20*.sql' -exec cp {} "$WORKDIR/supabase/migrations/" \;
          for version in 0059 0065 0067 0069 0075; do
            matches=(supabase/migrations/"${version}"*.sql)
            test -f "${matches[0]}" || { echo "::error::Missing applied migration source $version"; exit 1; }
            cp "${matches[0]}" "$WORKDIR/supabase/migrations/"
          done
          cat > "$WORKDIR/supabase/config.toml" <<'TOML'
          project_id = "zannychat-live-preferences-preview"
          [db.migrations]
          enabled = true
          [db.seed]
          enabled = false
          TOML
          printf 'workdir=%s\n' "$WORKDIR" >> "$GITHUB_OUTPUT"
      - name: Verify exactly one pending migration and dry-run
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase link --project-ref vithpppgyjmazxvogvno --password "$SUPABASE_DB_PASSWORD"
          MIGRATION_LIST="$(supabase migration list --linked)"
          printf '%s\n' "$MIGRATION_LIST"
          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/^[[:space:]]*`?[0-9]+`?[[:space:]]*\|/ {
            local_version=$1; remote_version=$2
            gsub(/[`[:space:]]/, "", local_version); gsub(/[`[:space:]]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          EXPECTED="20261119180000"
          if [ "$PENDING" != "$EXPECTED" ]; then
            echo "::error::Unexpected pending migration set; refusing preview."
            printf 'Expected: %s\nActual:\n%s\n' "$EXPECTED" "$PENDING"
            exit 1
          fi
          supabase db push --dry-run --linked
          echo "Preview only. No production changes were applied."
