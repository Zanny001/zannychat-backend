name: LIVE production database migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the two reviewed LIVE migrations after the dry-run preview"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zannychat-live-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Preview and optionally apply reviewed migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository/environment secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository/environment secret"; exit 1; }
          supabase link --project-ref vithpppgyjmazxvogvno --password "$SUPABASE_DB_PASSWORD"

      - name: Verify only the two reviewed LIVE migrations are pending
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          supabase migration list
          supabase db push --dry-run
          if [ "$APPLY_MIGRATIONS" != "true" ]; then
            echo "Preview only. No production database changes were made."
            exit 0
          fi

      - name: Apply reviewed migrations
        if: inputs.apply
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify migration history
        if: inputs.apply
        run: |
          set -euo pipefail
          supabase migration list
