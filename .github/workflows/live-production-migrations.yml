name: LIVE production migration preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zannychat-live-production-migrations
  cancel-in-progress: false

jobs:
  preview:
    name: Preview pending production migrations (no changes)
    runs-on: ubuntu-latest
    environment: production
    env:
      # Supabase CLI commands in every step need the access token.
      # Keep credentials at job scope so migration list and db push inherit them.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate credentials and link production project
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository/environment secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository/environment secret"; exit 1; }
          supabase --version
          supabase link --project-ref vithpppgyjmazxvogvno --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration history and dry-run plan
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase db push --dry-run --linked
          echo "Preview complete. This workflow never applies migrations."
