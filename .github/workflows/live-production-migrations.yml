name: LIVE production migration preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zannychat-live-production-migrations
  cancel-in-progress: false

jobs:
  preview:
    name: Preview only the two approved LIVE migrations (no changes)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository/environment secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository/environment secret"; exit 1; }
          supabase --version

      - name: Build an isolated migration workspace with applied history
        id: workspace
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d "${RUNNER_TEMP}/zannychat-live-migrations.XXXXXX")"
          mkdir -p "$WORKDIR/supabase/migrations"

          # Retain the source SQL for migrations already represented in the
          # production ledger. The old 0001-0064 files are intentionally
          # excluded except 0059, which production records as applied.
          # All timestamped migrations are retained; only the two reviewed
          # LIVE migrations below are expected to be pending.
          find supabase/migrations -maxdepth 1 -type f -name '20*.sql' -exec cp {} "$WORKDIR/supabase/migrations/" \;
          for version in 0059 0065 0067 0069 0075; do
            matches=(supabase/migrations/"${version}"*.sql)
            if [ -f "${matches[0]}" ]; then
              cp "${matches[0]}" "$WORKDIR/supabase/migrations/"
            else
              echo "::error::Expected applied production migration source ${version}*.sql was not found"
              exit 1
            fi
          done

          cp supabase/migrations/20261118221000_live_experience_modes.sql "$WORKDIR/supabase/migrations/"
          cp supabase/migrations/20261118223000_block_removed_live_participants.sql "$WORKDIR/supabase/migrations/"

          cat > "$WORKDIR/supabase/config.toml" <<'TOML'
          project_id = "zannychat-live-production-preview"

          [db.migrations]
          enabled = true

          [db.seed]
          enabled = false
          TOML

          FILE_COUNT="$(find "$WORKDIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          echo "Migration source files retained for comparison: $FILE_COUNT"
          test "$FILE_COUNT" -gt 2 || { echo "::error::Applied migration history was not included"; exit 1; }
          printf 'workdir=%s\n' "$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "Isolated workspace migration filenames:"
          find "$WORKDIR/supabase/migrations" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Link production and preview restricted migration plan
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase link --project-ref vithpppgyjmazxvogvno --password "$SUPABASE_DB_PASSWORD"

          echo "=== Local and production migration history ==="
          MIGRATION_LIST="$(supabase migration list --linked)"
          printf '%s\n' "$MIGRATION_LIST"

          echo "=== Assert exactly the two approved LIVE migrations are pending ==="
          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/\`[0-9]/ {
            local_version=$2
            remote_version=$3
            gsub(/[ \`]/, "", local_version)
            gsub(/[ \`]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          EXPECTED="$(printf '%s\n' 20261118221000 20261118223000 | sort)"
          if [ "$PENDING" != "$EXPECTED" ]; then
            echo "::error::Unexpected pending migration set."
            echo "Expected:"
            printf '%s\n' "$EXPECTED"
            echo "Actual:"
            printf '%s\n' "$PENDING"
            exit 1
          fi

          echo "=== Production dry-run: only the two approved LIVE migrations ==="
          supabase db push --dry-run --linked
          echo "Preview complete. No production migrations were applied."
