name: Apply approved LIVE production migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production_apply:
        description: "Confirm applying exactly the two reviewed LIVE migrations to production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zannychat-live-production-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exactly two approved LIVE migrations
    if: inputs.confirm_production_apply == true
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate credentials and CLI options
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase --version
          supabase db push --help

      - name: Build isolated migration workspace
        id: workspace
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d "${RUNNER_TEMP}/zannychat-live-apply.XXXXXX")"
          mkdir -p "$WORKDIR/supabase/migrations"
          find supabase/migrations -maxdepth 1 -type f -name '20*.sql' -exec cp {} "$WORKDIR/supabase/migrations/" \;
          for version in 0059 0065 0067 0069 0075; do
            matches=(supabase/migrations/"${version}"*.sql)
            test -f "${matches[0]}" || { echo "::error::Missing applied migration source ${version}"; exit 1; }
            cp "${matches[0]}" "$WORKDIR/supabase/migrations/"
          done
          cp supabase/migrations/20261118221000_live_experience_modes.sql "$WORKDIR/supabase/migrations/"
          cp supabase/migrations/20261118223000_block_removed_live_participants.sql "$WORKDIR/supabase/migrations/"
          cat > "$WORKDIR/supabase/config.toml" <<'TOML'
          project_id = "zannychat-live-production-apply"
          [db.migrations]
          enabled = true
          [db.seed]
          enabled = false
          TOML
          test "$(find "$WORKDIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 2
          printf 'workdir=%s\n' "$WORKDIR" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact production pending set
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase link --project-ref vithpppgyjmazxvogvno --password "$SUPABASE_DB_PASSWORD"
          MIGRATION_LIST="$(supabase migration list --linked)"
          printf '%s\n' "$MIGRATION_LIST"
          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/^[[:space:]]*`?[0-9]+`?[[:space:]]*\|/ {
            local_version=$1
            remote_version=$2
            gsub(/[`[:space:]]/, "", local_version)
            gsub(/[`[:space:]]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          EXPECTED="$(printf '%s\n' 20261118221000 20261118223000 | sort)"
          if [ "$PENDING" != "$EXPECTED" ]; then
            echo "::error::Production pending migration set changed; refusing apply."
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED" "$PENDING"
            exit 1
          fi
          echo "Exact approved pending set confirmed."

      - name: Re-run dry-run immediately before production apply
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase db push --dry-run --linked

      - name: Apply the two approved production migrations
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase db push --linked --yes

      - name: Verify production migration history
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          MIGRATION_LIST="$(supabase migration list --linked)"
          printf '%s\n' "$MIGRATION_LIST"
          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/^[[:space:]]*`?[0-9]+`?[[:space:]]*\|/ {
            local_version=$1
            remote_version=$2
            gsub(/[`[:space:]]/, "", local_version)
            gsub(/[`[:space:]]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          if [ -n "$PENDING" ]; then
            echo "::error::Unexpected pending migrations remain after apply:"
            printf '%s\n' "$PENDING"
            exit 1
          fi
          echo "Production migration history verification complete."
