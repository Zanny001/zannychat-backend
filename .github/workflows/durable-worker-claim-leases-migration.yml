name: Apply durable worker and LIVE Event index migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production_apply:
        description: "Confirm applying exactly migrations 20261120120000 and 20261120130000 to production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zannychat-live-production-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Preview and apply the two reviewed worker/foreign-key migrations
    if: inputs.confirm_production_apply == true
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out backend repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate credentials and CLI options
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          supabase --version
          supabase db push --help

      - name: Build isolated migration workspace
        id: workspace
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d "${RUNNER_TEMP}/zannychat-worker-leases.XXXXXX")"
          mkdir -p "$WORKDIR/supabase/migrations"

          # Retain all timestamped source migrations except creator-preferences:
          # production records that migration under a different ledger version
          # (20261119184056). Excluding its mismatched source filename prevents
          # a false pending migration or any attempt to replay its SQL.
          find supabase/migrations -maxdepth 1 -type f -name '20*.sql' \
            ! -name '20261119180000_live_creator_preferences.sql' \
            -exec cp {} "$WORKDIR/supabase/migrations/" \;

          # Retain the legacy source files that the production ledger records.
          for version in 0059 0065 0067 0069 0075; do
            matches=(supabase/migrations/"${version}"*.sql)
            test -f "${matches[0]}" || { echo "::error::Missing applied migration source $version"; exit 1; }
            cp "${matches[0]}" "$WORKDIR/supabase/migrations/"
          done

          cat > "$WORKDIR/supabase/config.toml" <<'TOML'
          project_id = "zannychat-worker-lease-production"
          [db.migrations]
          enabled = true
          [db.seed]
          enabled = false
          TOML

          printf 'workdir=%s\n' "$WORKDIR" >> "$GITHUB_OUTPUT"

      - name: Link production and assert exactly one pending migration
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase link --project-ref vithpppgyjmazxvogvno --password "$SUPABASE_DB_PASSWORD"
          MIGRATION_LIST="$(supabase migration list --linked)"
          printf '%s\n' "$MIGRATION_LIST"

          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/^[[:space:]]*`?[0-9]+`?[[:space:]]*\|/ {
            local_version=$1
            remote_version=$2
            gsub(/[`[:space:]]/, "", local_version)
            gsub(/[`[:space:]]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          EXPECTED="$(printf '%s\n' 20261120120000 20261120130000 | sort)"
          if [ "$PENDING" != "$EXPECTED" ]; then
            echo "::error::Refusing production apply: expected exactly the two reviewed pending migrations."
            printf 'Expected: %s\nActual:\n%s\n' "$EXPECTED" "$PENDING"
            exit 1
          fi

          echo "Exact migration set confirmed. Preview only:"
          supabase db push --dry-run --linked

      - name: Revalidate exact pending set immediately before apply
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          MIGRATION_LIST="$(supabase migration list --linked)"
          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/^[[:space:]]*`?[0-9]+`?[[:space:]]*\|/ {
            local_version=$1
            remote_version=$2
            gsub(/[`[:space:]]/, "", local_version)
            gsub(/[`[:space:]]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          EXPECTED="$(printf '%s\n' 20261120120000 20261120130000 | sort)"
          test "$PENDING" = "$EXPECTED" || {
            echo "::error::Pending migration set changed; refusing apply."
            printf '%s\n' "$PENDING"
            exit 1
          }
          supabase db push --dry-run --linked

      - name: Apply the two confirmed production migrations
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          supabase db push --linked --yes

      - name: Verify production migration history
        env:
          WORKDIR: ${{ steps.workspace.outputs.workdir }}
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          MIGRATION_LIST="$(supabase migration list --linked)"
          printf '%s\n' "$MIGRATION_LIST"
          PENDING="$(printf '%s\n' "$MIGRATION_LIST" | awk -F'|' '/^[[:space:]]*`?[0-9]+`?[[:space:]]*\|/ {
            local_version=$1
            remote_version=$2
            gsub(/[`[:space:]]/, "", local_version)
            gsub(/[`[:space:]]/, "", remote_version)
            if (local_version != "" && remote_version == "") print local_version
          }' | sort)"
          test -z "$PENDING" || {
            echo "::error::Unexpected pending migrations remain."
            printf '%s\n' "$PENDING"
            exit 1
          }
          echo "Worker-lease and LIVE Event index migrations applied; migration history verified."
