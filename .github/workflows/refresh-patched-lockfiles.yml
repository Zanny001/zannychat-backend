name: Refresh patched dependency lockfiles

on:
  push:
    branches:
      - security/express-transitive-patches

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate Yarn classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Resolve patched Yarn dependency tree
        run: yarn install --non-interactive
      - name: Resolve patched npm dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match the patched dependency graph."
            exit 0
          fi
          git commit -m "chore: refresh patched dependency lockfiles"
          git push
