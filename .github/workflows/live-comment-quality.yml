name: LIVE comment quality

on:
  push:
    branches: [fix/live-comment-display-names-1.2.242]
  pull_request:
    branches: [main]

concurrency:
  group: live-comment-quality-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:live-streams
      - run: npm run test:group-calls
      - run: npm run test:group-live-admission
