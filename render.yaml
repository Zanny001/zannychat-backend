services:
  - type: web
    name: zannychat-backend
    runtime: node
    plan: free
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: INTERNAL_WEBHOOK_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: '3600'
