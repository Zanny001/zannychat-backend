services:
  - type: web
    name: zannychat-backend
    runtime: node
    plan: free
    buildCommand: yarn install
    startCommand: yarn start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: INTERNAL_WEBHOOK_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: '3600'
      - key: LIVE_GOOGLE_PLAY_BILLING_ENABLED
        value: 'false'
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.zannychat.app
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_AUDIENCE
        sync: false
      - key: GOOGLE_PLAY_PUBSUB_SERVICE_ACCOUNT_EMAIL
        sync: false
